<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bamlehri Aqua</title>
<style>
  :root{--veil:#ffffff;--ink:#14418f}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0b2f5e}
  body.loading{overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:10;pointer-events:none;transition:opacity .6s}
  #veil{position:fixed;inset:0;z-index:9;background:var(--veil);pointer-events:none;transition:opacity 2.4s ease}
  body.reveal #veil{opacity:0}

  header{position:fixed;top:0;left:0;right:0;height:76px;z-index:5;display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(16px,4vw,48px);background:#fff;border-bottom:1px solid #e6edf5;opacity:0;transition:opacity .8s}
  body.reveal header{opacity:1}
  #slot{position:relative;height:48px}
  #slot img{height:100%;width:100%;display:block;opacity:0;transition:opacity .5s}
  nav{display:flex;align-items:center;gap:clamp(4px,1.5vw,14px)}
  nav a{padding:9px 14px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
  nav a:hover{background:#eef3fb}
  nav a.cta{background:var(--ink);color:#fff}
  @media (max-width:640px){nav a:not(.cta){display:none}}

  main{position:relative;height:100vh;min-height:520px;padding-top:76px;overflow:hidden;opacity:0;transition:opacity .9s .3s}
  body.reveal main{opacity:1}
  .stage{position:absolute;left:0;right:0;top:76px;bottom:0;display:flex;align-items:center;justify-content:center}
  .stage img{max-width:92vw;max-height:calc(100vh - 76px - 24px);width:auto;height:auto;display:block;
    mix-blend-mode:multiply;                                   /* backdrop is white, so it melts into the page */
    -webkit-mask-image:linear-gradient(to bottom,#000 88%,transparent 100%),linear-gradient(to right,transparent,#000 3%,#000 97%,transparent);
    -webkit-mask-composite:source-in;
            mask-image:linear-gradient(to bottom,#000 88%,transparent 100%),linear-gradient(to right,transparent,#000 3%,#000 97%,transparent);
            mask-composite:intersect;
    animation:bob 7s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){.stage img{animation:none}}
  .brand{position:absolute;left:clamp(16px,4vw,48px);top:calc(76px + clamp(16px,4vh,40px));margin:0;z-index:2;
    font-size:clamp(46px,10vw,150px);font-weight:900;letter-spacing:.05em;line-height:1;color:#14418f}
  .tagline{position:absolute;right:clamp(16px,4vw,48px);bottom:clamp(18px,5vh,48px);margin:0;z-index:2;text-align:right;
    font-size:clamp(26px,4.6vw,66px);font-weight:800;line-height:1.15;color:#2aa8e8}
  /* TextEffect per="char" preset="fade": every character goes opacity 0 -> 1, staggered */
  .te .w{display:inline-block;white-space:nowrap}
  .te .ch{display:inline-block;white-space:pre;opacity:0;transition:opacity .35s ease-out}
  .te.in .ch{opacity:1}

  .tag{position:fixed;left:0;right:0;bottom:6vh;text-align:center;font:500 14px/1 system-ui,sans-serif;letter-spacing:.12em;color:var(--ink);opacity:.7;z-index:11;transition:opacity .4s}
</style>

function splitChars(el){
  const nodes = [...el.childNodes]; el.textContent = '';
  let i = 0;
  const mk = (c) => { const s=document.createElement('span'); s.className='ch'; s.textContent=c; s.setAttribute('aria-hidden','true'); s.style.transitionDelay=(i++*STAGGER)+'ms'; return s; };
  for (const n of nodes){
    if (n.nodeType !== 3){ el.appendChild(n.cloneNode(true)); continue; }          // keep <br>
    n.textContent.split(' ').forEach((word, wi, arr) => {
      if (word){ const w=document.createElement('span'); w.className='w'; w.setAttribute('aria-hidden','true'); for (const c of word) w.appendChild(mk(c)); el.appendChild(w); }
      if (wi < arr.length-1) el.appendChild(mk(' '));
    });
  }
}
const fxEls = [...document.querySelectorAll('.te')];
fxEls.forEach(splitChars);
let fxStarted = false;
function startTextEffects(){
  if (fxStarted) return; fxStarted = true;
  fxEls.forEach(el => setTimeout(() => el.classList.add('in'), +el.dataset.delay || 0));
}
if (reduce) fxEls.forEach(el => { el.querySelectorAll('.ch').forEach(c => c.style.transition='none'); el.classList.add('in'); });
else new MutationObserver((_, ob) => { if (document.body.classList.contains('reveal')){ ob.disconnect(); setTimeout(startTextEffects, 700); } })
       .observe(document.body, {attributes:true, attributeFilter:['class']});

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const slot = document.getElementById('slot'), hlogo = document.getElementById('hlogo');
let vw, vh, dpr, buf32, imgData, scale, ox, oy, hscale, hox, hoy, ps, psHead, psCur = 2;
let P = [], lc, lw, lh, step, raf;

const seq = [];
for (let i = 0; i < CYCLES; i++) seq.push('float', 'form', 'hold');
seq.push('scatter', 'head');
let ready = false, gAlpha = 1;
let si = 0, phase = seq[0], pt = 0, burst = false, finished = false;
let pageLoaded = document.readyState === 'complete';
addEventListener('load', () => pageLoaded = true);

const img = new Image();
img.onload = init;
img.src = LOGO;

const bk=g=>.85-.5*(g/255);   // lightening amount: dark blue -> near white, light blue -> pale cyan
function init(){
  // isolate the blue logo pixels from the grey paper background
  const W = img.width, H = img.height;
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  const o = oc.getContext('2d', {willReadFrequently:true});
  o.drawImage(img,0,0);
  const d = o.getImageData(0,0,W,H), p = d.data;
  let x0=W,y0=H,x1=0,y1=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=(y*W+x)*4, blue=p[i+2]-p[i];
    const a=Math.max(0,Math.min(1,(blue-35)/40));
    p[i+3]=a*255;
    if(a>.5){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  o.putImageData(d,0,0);
  lw=x1-x0+1; lh=y1-y0+1;
  lc=document.createElement('canvas'); lc.width=lw; lc.height=lh;
  lc.getContext('2d').drawImage(oc,x0,y0,lw,lh,0,0,lw,lh);
  hlogo.src = lc.toDataURL('image/png');   // original-colour logo for the light glass header
  slot.style.width = (48*lw/lh)+'px';

  const ld=lc.getContext('2d').getImageData(0,0,lw,lh).data;
  let n=0; for(let i=3;i<ld.length;i+=4) if(ld[i]>128) n++;
  step=Math.max(1,Math.sqrt(n/MAX_PARTICLES));          // fractional step -> particle count tracks the budget closely
  for(let gy=0;gy<lh;gy+=step)for(let gx=0;gx<lw;gx+=step){
    const x0=gx|0, y0=gy|0, x1=Math.min(lw,Math.max(x0+1,(gx+step)|0)), y1=Math.min(lh,Math.max(y0+1,(gy+step)|0));
    let c=0,sr=0,sg=0,sb=0;                              // average the whole block: smooth colour, no jagged/noisy edges
    for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){ const i=(y*lw+x)*4; if(ld[i+3]>128){ c++; sr+=ld[i]; sg+=ld[i+1]; sb+=ld[i+2]; } }
    if(c*2<(x1-x0)*(y1-y0)) continue;                    // block mostly empty -> no particle
    const R=Math.round(sr/c),G=Math.round(sg/c),B=Math.round(sb/c),k=bk(G);
    P.push({lx:x0,ly:y0,x:0,y:0,vx:0,vy:0,tx:0,ty:0,hx:0,hy:0,
      c:(255<<24)|(B<<16)|(G<<8)|R,
      r:R,g:G,b:B,r2:R+(255-R)*k,g2:G+(255-G)*k,b2:B+(255-B)*k,
      ph:Math.random()*6.283, delay:Math.random()*.45});
  }
  addEventListener('resize',resize);
  last=performance.now(); raf=requestAnimationFrame(loop);
}

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  vw=innerWidth; vh=innerHeight;
  if(!vw||!vh){ buf32=null; return; }          // page not measured yet, retry next frame
  cv.width=Math.max(1,vw*dpr|0); cv.height=Math.max(1,vh*dpr|0);
  imgData=ctx.createImageData(cv.width,cv.height);
  buf32=new Uint32Array(imgData.data.buffer);
  // big centred logo
  scale=Math.min(vw*.84/lw, vh*.66/lh);
  ox=(vw-lw*scale)/2; oy=(vh-lh*scale)/2 - vh*.02;
  ps=Math.max(2,Math.ceil(scale*step*dpr));
  // small header logo
  const r=slot.getBoundingClientRect();
  hscale=(r.height||48)/lh; hox=r.left; hoy=r.top;
  psHead=Math.max(1,Math.ceil(hscale*step*dpr));
  for(const q of P){
    q.tx=ox+q.lx*scale;   q.ty=oy+q.ly*scale;
    q.hx=hox+q.lx*hscale; q.hy=hoy+q.ly*hscale;
  }
}

function flow(x,y,t,ph){
  const a=Math.sin(x*.0035+t*.5+ph*.15)*Math.cos(y*.0042-t*.4)
        +Math.sin((x+y)*.002+t*.3)*.6;
  return a*Math.PI*1.6;
}
const ease=k=>k<0?0:k>1?1:k*k*(3-2*k);

function next(){
  const prev=phase;
  si++;
  if(si>=seq.length){ phase='done'; finish(); return; }
  phase=seq[si]; pt=0;
  if(prev==='hold' && phase==='scatter') burst=true;
  if(phase==='head'){
    document.body.classList.add('reveal');          // site + header fade in as the particles flow there
    document.getElementById('tag').style.opacity=0;
  }
}

function finish(){
  if(finished) return; finished=true;
  const v=document.getElementById('veil'); if(v) setTimeout(()=>v.remove(),2600);
  hlogo.style.opacity=1;                            // crisp logo takes over in the header
  setTimeout(()=>{ cv.style.opacity=0; },250);
  setTimeout(()=>{ cancelAnimationFrame(raf); cv.remove(); document.getElementById('tag').remove();
                   document.body.classList.remove('loading'); },900);
}

let last=0;
function loop(now){
  if(!buf32) resize();
  if(!buf32){ last=now; raf=requestAnimationFrame(loop); return; }
  if(!ready){ for(const q of P){ q.x=Math.random()*vw; q.y=Math.random()*vh; } ready=true; last=now; }
  const dt=Math.min(now-last,50); last=now; pt+=dt;
  const f=dt/16.67, t=now/1000;

  // wait on the last float until the real page has loaded
  const waiting = phase==='scatter' && si===seq.length-2 && !pageLoaded;
  if(phase!=='done' && pt>T[phase] && !waiting) next();

  const cx=vw/2, cy=vh/2;
  const hd = phase==='head' || phase==='done';
  for(const q of P){
    if(burst){
      const ang=Math.atan2(q.y-cy,q.x-cx)+(Math.random()-.5)*1.2;
      const sp=3+Math.random()*9;
      q.vx=Math.cos(ang)*sp; q.vy=Math.sin(ang)*sp;
    }
    const gx=hd?q.hx:q.tx, gy=hd?q.hy:q.ty;
    if(phase==='float'||phase==='scatter'){
      const a=flow(q.x,q.y,t,q.ph);
      q.vx+=Math.cos(a)*.18*f; q.vy+=Math.sin(a)*.18*f;
      const d=Math.pow(.965,f); q.vx*=d; q.vy*=d;
    } else {
      const k=pt/T[phase==='done'?'head':phase];
      const on=(phase==='hold'||phase==='done') ? 1 : ease((k-q.delay)/.5);
      if(on<=0){
        const a=flow(q.x,q.y,t,q.ph);
        q.vx+=Math.cos(a)*.18*f; q.vy+=Math.sin(a)*.18*f;
        const d=Math.pow(.965,f); q.vx*=d; q.vy*=d;
      } else {
        const s=.012+.07*on;
        q.vx+=(gx-q.x)*s*f; q.vy+=(gy-q.y)*s*f;
        const d=Math.pow(.84,f); q.vx*=d; q.vy*=d;
        if(on<1){ const a=flow(q.x,q.y,t,q.ph)+1.5; q.vx+=Math.cos(a)*.25*(1-on)*f; q.vy+=Math.sin(a)*.25*(1-on)*f; }
      }
    }
    q.x+=q.vx*f; q.y+=q.vy*f;
    if(phase==='float'||phase==='scatter'){
      if(q.x<-20)q.x+=vw+40; else if(q.x>vw+20)q.x-=vw+40;
      if(q.y<-20)q.y+=vh+40; else if(q.y>vh+20)q.y-=vh+40;
    }
  }
  burst=false;

  // particle size shrinks smoothly when flying to the header
  psCur += ((hd?psHead:ps)-psCur)*Math.min(1,.06*f);
  const sz=Math.max(1,Math.round(psCur));

  gAlpha = 1;
  const al=Math.round(gAlpha*255);
  const m = 0;
  buf32.fill(0);
  const W=cv.width,H=cv.height;
  for(const q of P){
    if(al===0) break;
    const col = m>0 ? (al<<24)|(((q.b+(q.b2-q.b)*m)|0)<<16)|(((q.g+(q.g2-q.g)*m)|0)<<8)|((q.r+(q.r2-q.r)*m)|0) : (al<<24)|(q.c&0xFFFFFF);
    const px=(q.x*dpr)|0, py=(q.y*dpr)|0;
    if(px<0||py<0||px+sz>=W||py+sz>=H) continue;
    for(let j=0;j<sz;j++){ const r=(py+j)*W+px; for(let i=0;i<sz;i++) buf32[r+i]=col; }
  }
  ctx.putImageData(imgData,0,0);

  {                              // exact full-resolution logo crossfades in as the particles settle
    let a=0;
    if(phase==='form') a=ease((pt/T.form-.8)/.2);
    else if(phase==='hold') a=1-ease((pt-(T.hold-500))/450);
    if(a>0){ ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
             ctx.globalAlpha=a; ctx.drawImage(lc,ox*dpr,oy*dpr,lw*scale*dpr,lh*scale*dpr); ctx.globalAlpha=1; }
  }
  if(!finished || cv.isConnected) raf=requestAnimationFrame(loop);
}
</script>
</body>
</html>
